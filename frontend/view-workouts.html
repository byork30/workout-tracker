<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Past Workouts — Workout Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="hero">
    <div class="hero-inner">
      <p class="kicker"><a href="index.html" style="color:inherit;">&larr; Back</a></p>
      <h1>Past Workouts</h1>
      <p class="subhead">See each training session, how hard it felt, and the details behind the work.</p>
    </div>
  </main>

  <section class="history-panel">
    <div id="history-list" class="history-list" aria-live="polite"></div>
    <p id="history-status" class="form-status" role="status" aria-live="polite"></p>
  </section>

  <script>
    const API_BASE = 'http://127.0.0.1:8000';
    const historyList = document.getElementById('history-list');
    const statusEl = document.getElementById('history-status');

    const DASH = '\u2013'; // en dash, shown for any missing value

    function escapeHtml(value) {
      const div = document.createElement('div');
      div.textContent = value;
      return div.innerHTML;
    }

    // Returns the dash for null/undefined/empty-string, otherwise the value untouched.
    function orDash(value) {
      return value === null || value === undefined || value === '' ? DASH : value;
    }

    function formatDate(dateString) {
      const date = new Date(dateString + 'T00:00:00');
      return new Intl.DateTimeFormat('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric',
      }).format(date);
    }

    function formatWeight(weight, unit) {
      return weight === null || weight === undefined ? DASH : `${weight} ${unit}`;
    }

    function formatDuration(seconds) {
      if (seconds === null || seconds === undefined) return DASH;
      const minutes = seconds / 60;
      const rounded = Number.isInteger(minutes) ? minutes : Math.round(minutes * 10) / 10;
      return `${rounded} min`;
    }

    function formatDistance(distance) {
      return distance === null || distance === undefined ? DASH : `${distance} mi`;
    }

    // ---------- Rendering one set row ----------

    function renderSetRow(set, index, category, weightUnit) {
      const warmupTag = set.is_warmup ? '<span class="warmup-tag">Warm-up</span>' : '';

      if (category === 'strength') {
        return `
          <div class="set-line">
            <span class="set-label">Set ${index + 1}</span>
            <span>${orDash(set.reps)} reps</span>
            <span>${formatWeight(set.weight, weightUnit)}</span>
            ${warmupTag}
          </div>
        `;
      }

      return `
        <div class="set-line">
          <span class="set-label">Set ${index + 1}</span>
          <span>${orDash(set.reps)} reps</span>
          <span>${formatDuration(set.duration_seconds)}</span>
          <span>${formatDistance(set.distance)}</span>
          <span>${orDash(set.pace_per_mile)} / mi</span>
        </div>
      `;
    }

    // ---------- Rendering one exercise (a catalog exercise + its sets) ----------

    function renderExercise(workoutExercise, weightUnit) {
      const exercise = workoutExercise.exercise;
      const setsHtml = (workoutExercise.sets || [])
        .map((set, index) => renderSetRow(set, index, exercise.category, weightUnit))
        .join('');

      const notes = workoutExercise.notes
        ? `<p class="exercise-notes">${escapeHtml(workoutExercise.notes)}</p>`
        : '';

      return `
        <div class="exercise-entry">
          <div class="exercise-header">
            <h3>${escapeHtml(exercise.name)}</h3>
            <span class="badge ${exercise.category}">${exercise.category}</span>
          </div>
          <div class="set-rows">
            ${setsHtml || '<p class="empty-state">No sets logged.</p>'}
          </div>
          ${notes}
        </div>
      `;
    }

    // ---------- Rendering one workout ----------

    function renderWorkout(workout) {
      const exercisesHtml = (workout.exercises || [])
        .map((we) => renderExercise(we, workout.weight_unit))
        .join('');

      const notes = workout.notes
        ? `<p class="workout-note">${escapeHtml(workout.notes)}</p>`
        : '';

      const title = workout.title ? escapeHtml(workout.title) : 'Workout';
      const intensity =
        workout.intensity === null || workout.intensity === undefined
          ? `${DASH} intensity`
          : `${workout.intensity}% intensity`;

      return `
        <article class="workout-card">
          <div class="workout-header">
            <div>
              <p class="workout-date">${formatDate(workout.date)} &middot; ${intensity}</p>
              <h2>${title}</h2>
            </div>
            <div class="workout-actions">
              <button class="small-btn edit-btn" data-id="${workout.id}">Edit</button>
              <button class="small-btn delete-btn" data-id="${workout.id}">Delete</button>
            </div>
          </div>
          ${notes}
          <div class="exercise-list-panel">
            ${exercisesHtml || '<p class="empty-state">No exercises logged for this workout.</p>'}
          </div>
        </article>
      `;
    }

    // ---------- Load + wire up actions ----------

    async function loadWorkouts() {
      try {
        statusEl.textContent = 'Loading workouts...';
        statusEl.classList.remove('error');
        const response = await fetch(`${API_BASE}/workouts`);
        if (!response.ok) throw new Error('Unable to load workouts.');

        const workouts = await response.json();

        if (!workouts.length) {
          historyList.innerHTML = '<div class="empty-panel">No workouts yet. Add your first session to start tracking progress.</div>';
          statusEl.textContent = 'No workouts logged yet.';
          return;
        }

        historyList.innerHTML = workouts.map(renderWorkout).join('');
        attachWorkoutActionHandlers();
        statusEl.textContent = `${workouts.length} workout${workouts.length === 1 ? '' : 's'} loaded.`;
      } catch (error) {
        statusEl.textContent = error.message;
        statusEl.classList.add('error');
      }
    }

    function attachWorkoutActionHandlers() {
      document.querySelectorAll('.delete-btn').forEach((button) => {
        button.addEventListener('click', async () => {
          const workoutId = button.dataset.id;
          const response = await fetch(`${API_BASE}/workouts/${workoutId}`, { method: 'DELETE' });

          if (!response.ok) {
            statusEl.textContent = 'Unable to delete workout.';
            statusEl.classList.add('error');
            return;
          }

          loadWorkouts();
        });
      });

      document.querySelectorAll('.edit-btn').forEach((button) => {
        button.addEventListener('click', async () => {
          const workoutId = button.dataset.id;
          const response = await fetch(`${API_BASE}/workouts/${workoutId}`);
          if (!response.ok) {
            statusEl.textContent = 'Unable to load workout for editing.';
            statusEl.classList.add('error');
            return;
          }

          const workout = await response.json();
          const url = new URL('add-workout.html', window.location.href);
          url.searchParams.set('editWorkoutId', workoutId);
          url.searchParams.set('workoutData', encodeURIComponent(JSON.stringify(workout)));
          window.location.href = url.toString();
        });
      });
    }

    loadWorkouts();
  </script>
</body>
</html>
