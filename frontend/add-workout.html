<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Workout — Workout Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="hero">
    <div class="hero-inner">
      <p class="kicker"><a href="index.html" style="color:inherit;">&larr; Back</a></p>
      <h1>Add Workout</h1>
      <p class="subhead">Log the session, rate how hard it felt, and keep the details that actually matter.</p>
    </div>
  </main>

  <datalist id="exercise-catalog"></datalist>

  <section class="form-panel">
    <form id="workout-form">
      <div class="form-grid">
        <label class="field">
          <span>Workout date</span>
          <input type="date" id="workout-date" required>
        </label>

        <label class="field">
          <span>Title (optional)</span>
          <input type="text" id="workout-title" placeholder="Push day">
        </label>

        <label class="field">
          <span>Weight unit</span>
          <select id="weight-unit">
            <option value="lb">lb</option>
            <option value="kg">kg</option>
          </select>
        </label>

        <div class="field intensity-field">
          <span>How intense did this workout feel?</span>
          <div class="intensity-control">
            <input type="range" min="0" max="100" value="50" id="workout-intensity">
            <output id="workout-intensity-output">50%</output>
          </div>
        </div>

        <label class="field full-span">
          <span>Workout notes</span>
          <textarea id="workout-notes" rows="3" placeholder="How did it feel? What felt strong, weak, or worth repeating?"></textarea>
        </label>
      </div>

      <div id="exercise-list" class="exercise-list" aria-live="polite"></div>

      <div class="button-row">
        <button type="button" id="add-exercise" class="secondary-btn">+ Add exercise</button>
        <button type="submit" class="primary-btn">Save workout</button>
      </div>

      <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
    </form>
  </section>

  <script>
    const API_BASE = 'http://127.0.0.1:8000';

    const exerciseList = document.getElementById('exercise-list');
    const statusEl = document.getElementById('form-status');
    const datalistEl = document.getElementById('exercise-catalog');
    const params = new URLSearchParams(window.location.search);
    const editWorkoutId = params.get('editWorkoutId');
    const editWorkoutData = params.get('workoutData');

    let exerciseCounter = 0;
    let catalog = []; // [{id, name, category}, ...] fetched once from /exercises

    function escapeHtml(value) {
      const div = document.createElement('div');
      div.textContent = value;
      return div.innerHTML;
    }

    function toNumber(value) {
      if (value === '' || value === null || value === undefined) return null;
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : null;
    }

    function clean(value) {
      if (value === null || value === undefined) return null;
      const trimmed = String(value).trim();
      return trimmed === '' ? null : trimmed;
    }

    // ---------- Catalog loading ----------

    async function loadCatalog() {
      try {
        const response = await fetch(`${API_BASE}/exercises`);
        if (!response.ok) throw new Error('Failed to load exercise catalog.');
        catalog = await response.json();
        datalistEl.innerHTML = catalog
          .map((e) => `<option value="${escapeHtml(e.name)}">`)
          .join('');
      } catch (error) {
        statusEl.textContent = 'Could not reach the server to load exercises. Is the backend running?';
        statusEl.className = 'form-status error';
      }
    }

    function findCatalogMatch(name) {
      const normalized = name.trim().toLowerCase();
      if (!normalized) return null;
      return catalog.find((e) => e.name.toLowerCase() === normalized) || null;
    }

    // ---------- Exercise cards ----------

    function addExerciseCard(prefill = null) {
      const index = exerciseCounter;
      exerciseCounter += 1;

      const card = document.createElement('article');
      card.className = 'exercise-card';
      card.dataset.index = String(index);
      card.dataset.category = prefill?.category || '';
      card.dataset.exerciseId = prefill?.exerciseId || '';

      card.innerHTML = `
        <div class="exercise-card-header">
          <h2>Exercise ${index + 1}</h2>
          <button type="button" class="remove-btn" aria-label="Remove exercise">Remove</button>
        </div>

        <div class="exercise-grid">
          <label class="field">
            <span>Exercise name</span>
            <input type="text" data-role="name" list="exercise-catalog"
                   value="${escapeHtml(prefill?.name || '')}"
                   placeholder="Start typing: Bench Press, Running..." required>
          </label>

          <div class="field">
            <span>Type</span>
            <div class="category-indicator" data-role="category-badge">Pick an exercise to detect type</div>
            <select data-role="manual-category" hidden>
              <option value="strength">Strength (new exercise)</option>
              <option value="cardio">Cardio (new exercise)</option>
            </select>
          </div>

          <div class="strength-fields full-span" hidden>
            <div class="sets-list" data-role="strength-sets"></div>
            <button type="button" class="add-set-btn" data-role="add-strength-set">+ Add set</button>
          </div>

          <div class="cardio-fields full-span" hidden>
            <div class="sets-list" data-role="cardio-sets"></div>
            <button type="button" class="add-set-btn" data-role="add-cardio-set">+ Add interval</button>
          </div>

          <label class="field full-span">
            <span>Exercise notes</span>
            <textarea rows="2" data-role="notes" placeholder="Form cues, one-off notes, or what improved that day.">${escapeHtml(prefill?.notes || '')}</textarea>
          </label>
        </div>
      `;

      wireExerciseCard(card);

      if (prefill?.category) {
        applyCategory(card, prefill.category);
        (prefill.sets || []).forEach((set) => addSetRow(card, prefill.category, set));
      }

      const removeButton = card.querySelector('.remove-btn');
      removeButton.addEventListener('click', () => {
        card.remove();
        if (!exerciseList.children.length) addExerciseCard();
      });

      return card;
    }

    function wireExerciseCard(card) {
      const nameInput = card.querySelector('[data-role="name"]');
      const manualCategory = card.querySelector('[data-role="manual-category"]');

      const resolve = () => resolveCategoryForCard(card);
      nameInput.addEventListener('input', resolve);
      manualCategory.addEventListener('change', resolve);

      card.querySelector('[data-role="add-strength-set"]').addEventListener('click', () => {
        addSetRow(card, 'strength');
      });
      card.querySelector('[data-role="add-cardio-set"]').addEventListener('click', () => {
        addSetRow(card, 'cardio');
      });
    }

    function resolveCategoryForCard(card) {
      const nameInput = card.querySelector('[data-role="name"]');
      const manualCategory = card.querySelector('[data-role="manual-category"]');
      const badge = card.querySelector('[data-role="category-badge"]');
      const match = findCatalogMatch(nameInput.value);

      let category;
      if (match) {
        category = match.category;
        card.dataset.exerciseId = match.id;
        manualCategory.hidden = true;
        badge.hidden = false;
        badge.textContent = category === 'strength' ? 'Strength' : 'Cardio';
      } else if (nameInput.value.trim()) {
        category = manualCategory.value;
        card.dataset.exerciseId = '';
        manualCategory.hidden = false;
        badge.hidden = true;
      } else {
        card.dataset.exerciseId = '';
        card.dataset.category = '';
        manualCategory.hidden = true;
        badge.hidden = false;
        badge.textContent = 'Pick an exercise to detect type';
        toggleCategoryFields(card, null);
        return;
      }

      if (category !== card.dataset.category) {
        card.dataset.category = category;
        toggleCategoryFields(card, category);
        // Starting fresh in the newly-shown section: give it one empty row.
        const list = card.querySelector(
          category === 'strength' ? '[data-role="strength-sets"]' : '[data-role="cardio-sets"]'
        );
        if (!list.children.length) addSetRow(card, category);
      }
    }

    function applyCategory(card, category) {
      card.dataset.category = category;
      const manualCategory = card.querySelector('[data-role="manual-category"]');
      const badge = card.querySelector('[data-role="category-badge"]');
      manualCategory.value = category;
      badge.hidden = !card.dataset.exerciseId;
      manualCategory.hidden = !!card.dataset.exerciseId;
      badge.textContent = category === 'strength' ? 'Strength' : 'Cardio';
      toggleCategoryFields(card, category);
    }

    function toggleCategoryFields(card, category) {
      card.querySelector('.strength-fields').hidden = category !== 'strength';
      card.querySelector('.cardio-fields').hidden = category !== 'cardio';
    }

    // ---------- Set rows ----------

    function addSetRow(card, category, prefill = null) {
      const list = card.querySelector(
        category === 'strength' ? '[data-role="strength-sets"]' : '[data-role="cardio-sets"]'
      );
      const row = document.createElement('div');
      row.className = 'set-row';

      if (category === 'strength') {
        row.innerHTML = `
          <label class="field"><span>Reps</span>
            <input type="number" min="1" step="1" data-role="reps" value="${prefill?.reps ?? ''}" placeholder="8">
          </label>
          <label class="field"><span>Weight</span>
            <input type="number" min="0" step="0.5" data-role="weight" value="${prefill?.weight ?? ''}" placeholder="135">
          </label>
          <label class="checkbox-field"><input type="checkbox" data-role="is_warmup" ${prefill?.is_warmup ? 'checked' : ''}><span>Warm-up</span></label>
          <button type="button" class="remove-set-btn" aria-label="Remove set">&times;</button>
        `;
      } else {
        const durationMinutes = prefill?.duration_seconds != null ? prefill.duration_seconds / 60 : '';
        row.innerHTML = `
          <label class="field"><span>Reps / rounds</span>
            <input type="number" min="1" step="1" data-role="reps" value="${prefill?.reps ?? ''}" placeholder="optional">
          </label>
          <label class="field"><span>Duration (min)</span>
            <input type="number" min="0" step="0.5" data-role="duration_minutes" value="${durationMinutes}" placeholder="25">
          </label>
          <label class="field"><span>Distance (mi)</span>
            <input type="number" min="0" step="0.1" data-role="distance" value="${prefill?.distance ?? ''}" placeholder="3.1">
          </label>
          <label class="field"><span>Pace / mile</span>
            <input type="text" data-role="pace_per_mile" value="${escapeHtml(prefill?.pace_per_mile || '')}" placeholder="8:45">
          </label>
          <button type="button" class="remove-set-btn" aria-label="Remove set">&times;</button>
        `;
      }

      row.querySelector('.remove-set-btn').addEventListener('click', () => {
        if (list.children.length > 1) row.remove();
      });

      list.appendChild(row);
    }

    // ---------- Collecting the payload ----------

    async function resolveExerciseId(card) {
      const existingId = card.dataset.exerciseId;
      if (existingId) return Number(existingId);

      const name = card.querySelector('[data-role="name"]').value.trim();
      const category = card.dataset.category;
      const response = await fetch(`${API_BASE}/exercises`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, category }),
      });

      if (response.status === 409) {
        // Someone already added this name between page load and now - just look it up.
        const refreshed = await fetch(`${API_BASE}/exercises?q=${encodeURIComponent(name)}`);
        const matches = await refreshed.json();
        const found = matches.find((e) => e.name.toLowerCase() === name.toLowerCase());
        if (found) return found.id;
      }

      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.detail || `Could not save new exercise "${name}".`);
      return body.id;
    }

    function collectSets(card, category) {
      const list = card.querySelector(
        category === 'strength' ? '[data-role="strength-sets"]' : '[data-role="cardio-sets"]'
      );
      return Array.from(list.children).map((row) => {
        if (category === 'strength') {
          return {
            reps: toNumber(row.querySelector('[data-role="reps"]').value),
            weight: toNumber(row.querySelector('[data-role="weight"]').value),
            is_warmup: row.querySelector('[data-role="is_warmup"]').checked,
          };
        }
        const minutes = toNumber(row.querySelector('[data-role="duration_minutes"]').value);
        return {
          reps: toNumber(row.querySelector('[data-role="reps"]').value),
          duration_seconds: minutes !== null ? Math.round(minutes * 60) : null,
          distance: toNumber(row.querySelector('[data-role="distance"]').value),
          pace_per_mile: clean(row.querySelector('[data-role="pace_per_mile"]').value),
        };
      });
    }

    async function collectExercisePayload(card) {
      const category = card.dataset.category;
      if (!category) throw new Error('Pick an exercise for every exercise card before saving.');

      const exerciseId = await resolveExerciseId(card);
      const sets = collectSets(card, category).filter((set) => {
        // Drop fully-empty rows rather than sending them to the backend as invalid.
        return Object.entries(set).some(
          ([key, value]) => key !== 'is_warmup' && value !== null
        );
      });

      if (sets.length === 0) {
        const name = card.querySelector('[data-role="name"]').value.trim();
        throw new Error(`Add at least one set for "${name}".`);
      }

      return {
        exercise_id: exerciseId,
        notes: clean(card.querySelector('[data-role="notes"]').value),
        sets,
      };
    }

    // ---------- Submit ----------

    document.getElementById('workout-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      statusEl.textContent = '';
      statusEl.className = 'form-status';

      try {
        const cards = Array.from(exerciseList.querySelectorAll('.exercise-card'));
        if (cards.length === 0) throw new Error('Add at least one exercise.');

        statusEl.textContent = editWorkoutId ? 'Updating workout...' : 'Saving workout...';

        const exercises = [];
        for (const card of cards) {
          exercises.push(await collectExercisePayload(card));
        }

        const payload = {
          date: document.getElementById('workout-date').value,
          title: clean(document.getElementById('workout-title').value),
          weight_unit: document.getElementById('weight-unit').value,
          intensity: toNumber(document.getElementById('workout-intensity').value),
          notes: clean(document.getElementById('workout-notes').value),
          exercises,
        };

        const method = editWorkoutId ? 'PUT' : 'POST';
        const endpoint = editWorkoutId ? `${API_BASE}/workouts/${editWorkoutId}` : `${API_BASE}/workouts`;

        const response = await fetch(endpoint, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(typeof body.detail === 'string' ? body.detail : JSON.stringify(body.detail || 'Unable to save workout.'));
        }

        statusEl.textContent = editWorkoutId ? 'Workout updated successfully.' : 'Workout saved successfully.';
        statusEl.classList.add('success');

        if (editWorkoutId) {
          window.location.href = 'view-workouts.html';
          return;
        }

        document.getElementById('workout-form').reset();
        document.getElementById('workout-date').valueAsDate = new Date();
        document.getElementById('workout-intensity-output').textContent = '50%';
        exerciseList.innerHTML = '';
        addExerciseCard();
      } catch (error) {
        statusEl.textContent = error.message;
        statusEl.classList.add('error');
      }
    });

    document.getElementById('add-exercise').addEventListener('click', () => {
      exerciseList.appendChild(addExerciseCard());
    });

    const intensityInput = document.getElementById('workout-intensity');
    intensityInput.addEventListener('input', () => {
      document.getElementById('workout-intensity-output').textContent = `${intensityInput.value}%`;
    });

    // ---------- Edit-mode prefill ----------

    function fillWorkoutForm(workout) {
      document.getElementById('workout-date').value = workout.date;
      document.getElementById('workout-title').value = workout.title || '';
      document.getElementById('weight-unit').value = workout.weight_unit || 'lb';
      document.getElementById('workout-intensity').value = workout.intensity ?? 50;
      document.getElementById('workout-intensity-output').textContent = `${workout.intensity ?? 50}%`;
      document.getElementById('workout-notes').value = workout.notes || '';
      document.querySelector('.hero h1').textContent = 'Edit Workout';
      document.querySelector('.subhead').textContent = 'Update the session details and save your changes.';
      document.querySelector('.primary-btn').textContent = 'Update workout';

      exerciseList.innerHTML = '';
      workout.exercises.forEach((we) => {
        exerciseList.appendChild(
          addExerciseCard({
            name: we.exercise.name,
            category: we.exercise.category,
            exerciseId: we.exercise.id,
            notes: we.notes,
            sets: we.sets,
          })
        );
      });
    }

    (async function init() {
      await loadCatalog();
      if (editWorkoutData) {
        try {
          fillWorkoutForm(JSON.parse(decodeURIComponent(editWorkoutData)));
        } catch (error) {
          statusEl.textContent = 'Unable to load workout for editing.';
          statusEl.className = 'form-status error';
        }
      } else {
        document.getElementById('workout-date').valueAsDate = new Date();
        addExerciseCard();
      }
    })();
  </script>
</body>
</html>
